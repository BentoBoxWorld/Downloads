name: Test Build / Run Downloads Site

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    # Dependencies are installed exactly as locked, with lifecycle scripts
    # disabled. sqlite3 is the only dependency that needs its install script
    # (it fetches the prebuilt native binding), so that one is run explicitly.
    - name: Install
      run: |
        npm install --global --ignore-scripts yarn@1.22.22
        yarn install --frozen-lockfile --ignore-scripts
        npm rebuild sqlite3

    - name: Build
      run: yarn build
